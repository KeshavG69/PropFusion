<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PropFusion - Investment Property Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .property-card {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .property-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.15);
        }
        .cap-rate-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .score-badge {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <h1 class="text-3xl font-bold text-gray-900">🏠 PropFusion</h1>
            <p class="text-gray-600 mt-1">Pennsylvania Investment Properties</p>
        </div>
    </header>

    <!-- Stats Bar -->
    <div class="bg-white border-b">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="stats">
                <div class="text-center">
                    <div class="text-2xl font-bold text-blue-600" id="total-properties">-</div>
                    <div class="text-sm text-gray-600">Total Properties</div>
                </div>
                <div class="text-center">
                    <div class="text-2xl font-bold text-green-600" id="avg-price">-</div>
                    <div class="text-sm text-gray-600">Avg Price</div>
                </div>
                <div class="text-center">
                    <div class="text-2xl font-bold text-purple-600" id="avg-cap-rate">-</div>
                    <div class="text-sm text-gray-600">Avg Cap Rate</div>
                </div>
                <div class="text-center">
                    <div class="text-2xl font-bold text-orange-600" id="avg-score">-</div>
                    <div class="text-sm text-gray-600">Avg Score</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Filters -->
    <div class="max-w-7xl mx-auto px-4 py-6">
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-lg font-semibold mb-4">Filters</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <!-- City Filter -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">City</label>
                    <select id="filter-city" class="w-full border rounded-lg px-3 py-2">
                        <option value="">All Cities</option>
                    </select>
                </div>

                <!-- Min Cap Rate -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Min Cap Rate (%)</label>
                    <input type="number" id="filter-cap-rate" placeholder="e.g., 5"
                           class="w-full border rounded-lg px-3 py-2" step="0.1">
                </div>

                <!-- Max Price -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Max Price ($)</label>
                    <input type="number" id="filter-max-price" placeholder="e.g., 200000"
                           class="w-full border rounded-lg px-3 py-2">
                </div>

                <!-- Min Beds -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Min Beds</label>
                    <select id="filter-beds" class="w-full border rounded-lg px-3 py-2">
                        <option value="">Any</option>
                        <option value="1">1+</option>
                        <option value="2">2+</option>
                        <option value="3">3+</option>
                        <option value="4">4+</option>
                    </select>
                </div>
            </div>

            <div class="mt-4 flex gap-2">
                <button onclick="applyFilters()"
                        class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">
                    Apply Filters
                </button>
                <button onclick="resetFilters()"
                        class="bg-gray-200 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-300">
                    Reset
                </button>
            </div>
        </div>

        <!-- Results Count -->
        <div class="mb-4 text-gray-600">
            <span id="results-count">Loading...</span>
        </div>

        <!-- Property Grid -->
        <div id="properties-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Properties will be loaded here -->
        </div>

        <!-- Pagination -->
        <div class="mt-8 flex justify-center gap-2" id="pagination">
            <!-- Pagination buttons will be loaded here -->
        </div>
    </div>

    <!-- Property Detail Modal -->
    <div id="property-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 overflow-y-auto">
        <div class="min-h-screen px-4 py-8">
            <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-2xl">
                <!-- Modal Header -->
                <div class="flex justify-between items-center p-6 border-b">
                    <h2 class="text-2xl font-bold text-gray-900">Property Details</h2>
                    <button onclick="closePropertyModal()" class="text-gray-500 hover:text-gray-700 text-3xl">
                        &times;
                    </button>
                </div>

                <!-- Modal Content -->
                <div id="property-detail-content" class="p-6">
                    <!-- Content will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8001';
        let currentPage = 1;
        let currentFilters = {};

        // Load stats on page load
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/api/properties/stats/summary`);
                const data = await response.json();

                document.getElementById('total-properties').textContent = data.total_properties;
                document.getElementById('avg-price').textContent =
                    '$' + Math.round(data.price_stats.avg_price).toLocaleString();
                document.getElementById('avg-cap-rate').textContent =
                    data.investment_stats.avg_cap_rate.toFixed(2) + '%';
                document.getElementById('avg-score').textContent =
                    data.investment_stats.avg_investment_score.toFixed(1) + '/100';

                // Populate city dropdown
                const citySelect = document.getElementById('filter-city');
                data.top_cities.forEach(city => {
                    const option = document.createElement('option');
                    option.value = city._id;
                    option.textContent = city._id;
                    citySelect.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Load properties
        async function loadProperties(page = 1) {
            currentPage = page;

            // Build query params
            const params = new URLSearchParams({
                page: page,
                page_size: 12,
                sort_by: 'investment_score',
                sort_order: 'desc',
                ...currentFilters
            });

            try {
                const response = await fetch(`${API_BASE}/api/properties/?${params}`);
                const data = await response.json();

                displayProperties(data.properties);
                displayPagination(data);

                document.getElementById('results-count').textContent =
                    `Showing ${data.properties.length} of ${data.total} properties`;
            } catch (error) {
                console.error('Error loading properties:', error);
                document.getElementById('properties-grid').innerHTML =
                    '<div class="col-span-3 text-center text-red-600">Error loading properties. Make sure the backend is running on port 8001.</div>';
            }
        }

        // Display properties
        function displayProperties(properties) {
            const grid = document.getElementById('properties-grid');

            if (properties.length === 0) {
                grid.innerHTML = '<div class="col-span-3 text-center text-gray-500">No properties found</div>';
                return;
            }

            grid.innerHTML = properties.map(prop => `
                <div class="property-card bg-white rounded-lg shadow hover:shadow-lg overflow-hidden cursor-pointer"
                     onclick="showPropertyDetails('${prop.property_id}')">
                    <!-- Image -->
                    <div class="h-48 bg-gray-200 relative">
                        ${prop.image_url ?
                            `<img src="${prop.image_url}" alt="Property" class="w-full h-full object-cover">` :
                            '<div class="w-full h-full flex items-center justify-center text-gray-400">No Image</div>'
                        }
                        ${prop.investment_metrics?.cap_rate ?
                            `<div class="absolute top-2 right-2 cap-rate-badge text-white px-3 py-1 rounded-full text-sm font-bold">
                                ${prop.investment_metrics.cap_rate.toFixed(2)}% Cap Rate
                            </div>` : ''
                        }
                    </div>

                    <!-- Content -->
                    <div class="p-4">
                        <!-- Price -->
                        <div class="text-2xl font-bold text-gray-900 mb-2">
                            ${prop.list_price ? '$' + prop.list_price.toLocaleString() : 'Price N/A'}
                        </div>

                        <!-- Address -->
                        <div class="text-gray-600 mb-3 text-sm">
                            ${prop.full_address || prop.city + ', ' + prop.state}
                        </div>

                        <!-- Property Details -->
                        <div class="flex gap-4 text-sm text-gray-600 mb-3">
                            ${prop.beds ? `<span>🛏️ ${prop.beds} beds</span>` : ''}
                            ${prop.baths ? `<span>🛁 ${prop.baths} baths</span>` : ''}
                            ${prop.sqft ? `<span>📏 ${prop.sqft.toLocaleString()} sqft</span>` : ''}
                        </div>

                        <!-- Investment Metrics -->
                        ${prop.investment_metrics?.investment_score ? `
                            <div class="border-t pt-3 mt-3">
                                <div class="flex justify-between items-center">
                                    <span class="text-sm text-gray-600">Investment Score</span>
                                    <span class="score-badge text-white px-3 py-1 rounded-full text-sm font-bold">
                                        ${prop.investment_metrics.investment_score.toFixed(1)}/100
                                    </span>
                                </div>
                                ${prop.investment_metrics.monthly_cash_flow ? `
                                    <div class="flex justify-between mt-2 text-sm">
                                        <span class="text-gray-600">Monthly Cash Flow</span>
                                        <span class="${prop.investment_metrics.monthly_cash_flow > 0 ? 'text-green-600' : 'text-red-600'} font-semibold">
                                            $${Math.round(prop.investment_metrics.monthly_cash_flow).toLocaleString()}/mo
                                        </span>
                                    </div>
                                ` : ''}
                            </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        // Display pagination
        function displayPagination(data) {
            const pagination = document.getElementById('pagination');
            const buttons = [];

            // Previous button
            if (data.page > 1) {
                buttons.push(`
                    <button onclick="loadProperties(${data.page - 1})"
                            class="px-4 py-2 bg-white border rounded-lg hover:bg-gray-50">
                        Previous
                    </button>
                `);
            }

            // Page numbers (show 5 pages max)
            const startPage = Math.max(1, data.page - 2);
            const endPage = Math.min(data.total_pages, startPage + 4);

            for (let i = startPage; i <= endPage; i++) {
                buttons.push(`
                    <button onclick="loadProperties(${i})"
                            class="px-4 py-2 ${i === data.page ? 'bg-blue-600 text-white' : 'bg-white'} border rounded-lg hover:bg-blue-50">
                        ${i}
                    </button>
                `);
            }

            // Next button
            if (data.page < data.total_pages) {
                buttons.push(`
                    <button onclick="loadProperties(${data.page + 1})"
                            class="px-4 py-2 bg-white border rounded-lg hover:bg-gray-50">
                        Next
                    </button>
                `);
            }

            pagination.innerHTML = buttons.join('');
        }

        // Apply filters
        function applyFilters() {
            currentFilters = {};

            const city = document.getElementById('filter-city').value;
            if (city) currentFilters.city = city;

            const capRate = document.getElementById('filter-cap-rate').value;
            if (capRate) currentFilters.min_cap_rate = parseFloat(capRate);

            const maxPrice = document.getElementById('filter-max-price').value;
            if (maxPrice) currentFilters.max_price = parseInt(maxPrice);

            const minBeds = document.getElementById('filter-beds').value;
            if (minBeds) currentFilters.min_beds = parseInt(minBeds);

            loadProperties(1);
        }

        // Reset filters
        function resetFilters() {
            document.getElementById('filter-city').value = '';
            document.getElementById('filter-cap-rate').value = '';
            document.getElementById('filter-max-price').value = '';
            document.getElementById('filter-beds').value = '';
            currentFilters = {};
            loadProperties(1);
        }

        // Show property details
        async function showPropertyDetails(propertyId) {
            try {
                const response = await fetch(`${API_BASE}/api/properties/${propertyId}`);
                const property = await response.json();

                displayPropertyDetail(property);
                document.getElementById('property-modal').classList.remove('hidden');
                document.body.style.overflow = 'hidden'; // Prevent background scrolling
            } catch (error) {
                console.error('Error loading property details:', error);
                alert('Error loading property details');
            }
        }

        // Close modal
        function closePropertyModal() {
            document.getElementById('property-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        // Display property detail
        function displayPropertyDetail(prop) {
            const content = document.getElementById('property-detail-content');
            const metrics = prop.investment_metrics || {};

            content.innerHTML = `
                <!-- Property Image -->
                <div class="mb-6">
                    ${prop.image_url ?
                        `<img src="${prop.image_url}" alt="Property" class="w-full h-96 object-cover rounded-lg">` :
                        '<div class="w-full h-64 bg-gray-200 rounded-lg flex items-center justify-center text-gray-400">No Image Available</div>'
                    }
                </div>

                <!-- Price and Address -->
                <div class="mb-6">
                    <div class="text-4xl font-bold text-gray-900 mb-2">
                        ${prop.list_price ? '$' + prop.list_price.toLocaleString() : 'Price Not Available'}
                    </div>
                    <div class="text-xl text-gray-600">
                        ${prop.full_address || prop.city + ', ' + prop.state + ' ' + (prop.zip_code || '')}
                    </div>
                </div>

                <!-- Property Details Grid -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                    <div class="bg-gray-50 p-4 rounded-lg">
                        <div class="text-gray-600 text-sm mb-1">Bedrooms</div>
                        <div class="text-2xl font-bold">${prop.beds || 'N/A'}</div>
                    </div>
                    <div class="bg-gray-50 p-4 rounded-lg">
                        <div class="text-gray-600 text-sm mb-1">Bathrooms</div>
                        <div class="text-2xl font-bold">${prop.baths || 'N/A'}</div>
                    </div>
                    <div class="bg-gray-50 p-4 rounded-lg">
                        <div class="text-gray-600 text-sm mb-1">Square Feet</div>
                        <div class="text-2xl font-bold">${prop.sqft ? prop.sqft.toLocaleString() : 'N/A'}</div>
                    </div>
                    <div class="bg-gray-50 p-4 rounded-lg">
                        <div class="text-gray-600 text-sm mb-1">Property Type</div>
                        <div class="text-lg font-bold">${prop.property_type || 'N/A'}</div>
                    </div>
                </div>

                <!-- Investment Metrics Section -->
                ${metrics.cap_rate || metrics.investment_score ? `
                    <div class="bg-gradient-to-r from-blue-50 to-purple-50 rounded-lg p-6 mb-6">
                        <h3 class="text-xl font-bold text-gray-900 mb-4">💰 Investment Metrics</h3>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${metrics.cap_rate ? `
                                <div class="bg-white rounded-lg p-4 shadow">
                                    <div class="text-gray-600 text-sm mb-1">Cap Rate</div>
                                    <div class="text-3xl font-bold text-purple-600">${metrics.cap_rate.toFixed(2)}%</div>
                                    <div class="text-xs text-gray-500 mt-1">Return on investment</div>
                                </div>
                            ` : ''}

                            ${metrics.monthly_cash_flow !== undefined ? `
                                <div class="bg-white rounded-lg p-4 shadow">
                                    <div class="text-gray-600 text-sm mb-1">Monthly Cash Flow</div>
                                    <div class="text-3xl font-bold ${metrics.monthly_cash_flow > 0 ? 'text-green-600' : 'text-red-600'}">
                                        $${Math.round(metrics.monthly_cash_flow).toLocaleString()}/mo
                                    </div>
                                    <div class="text-xs text-gray-500 mt-1">After expenses & mortgage</div>
                                </div>
                            ` : ''}

                            ${metrics.annual_noi ? `
                                <div class="bg-white rounded-lg p-4 shadow">
                                    <div class="text-gray-600 text-sm mb-1">Annual NOI</div>
                                    <div class="text-3xl font-bold text-blue-600">
                                        $${Math.round(metrics.annual_noi).toLocaleString()}
                                    </div>
                                    <div class="text-xs text-gray-500 mt-1">Net Operating Income</div>
                                </div>
                            ` : ''}

                            ${metrics.investment_score ? `
                                <div class="bg-white rounded-lg p-4 shadow">
                                    <div class="text-gray-600 text-sm mb-1">Investment Score</div>
                                    <div class="text-3xl font-bold text-orange-600">
                                        ${metrics.investment_score.toFixed(1)}/100
                                    </div>
                                    <div class="text-xs text-gray-500 mt-1">Overall rating</div>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                ` : ''}

                <!-- Zillow Data Section -->
                ${prop.zestimate || prop.rent_estimate ? `
                    <div class="border rounded-lg p-6 mb-6">
                        <h3 class="text-xl font-bold text-gray-900 mb-4">📊 Zillow Estimates</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${prop.zestimate ? `
                                <div>
                                    <div class="text-gray-600 text-sm mb-1">Zestimate</div>
                                    <div class="text-2xl font-bold text-blue-600">
                                        $${prop.zestimate.toLocaleString()}
                                    </div>
                                </div>
                            ` : ''}
                            ${prop.rent_estimate ? `
                                <div>
                                    <div class="text-gray-600 text-sm mb-1">Estimated Rent</div>
                                    <div class="text-2xl font-bold text-green-600">
                                        $${prop.rent_estimate.toLocaleString()}/month
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                ` : ''}

                <!-- Additional Details -->
                <div class="border rounded-lg p-6 mb-6">
                    <h3 class="text-xl font-bold text-gray-900 mb-4">ℹ️ Additional Details</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                        ${prop.lot_size ? `
                            <div class="flex justify-between">
                                <span class="text-gray-600">Lot Size:</span>
                                <span class="font-semibold">${prop.lot_size.toLocaleString()} ${prop.lot_size_units || 'sqft'}</span>
                            </div>
                        ` : ''}
                        ${prop.days_on_zillow !== null && prop.days_on_zillow !== undefined ? `
                            <div class="flex justify-between">
                                <span class="text-gray-600">Days on Zillow:</span>
                                <span class="font-semibold">${prop.days_on_zillow} days</span>
                            </div>
                        ` : ''}
                        <div class="flex justify-between">
                            <span class="text-gray-600">Status:</span>
                            <span class="font-semibold text-green-600">${prop.status || 'FOR_SALE'}</span>
                        </div>
                        ${prop.source_url ? `
                            <div class="flex justify-between col-span-2">
                                <span class="text-gray-600">Zillow Link:</span>
                                <a href="${prop.source_url}" target="_blank"
                                   class="text-blue-600 hover:underline font-semibold">
                                    View on Zillow →
                                </a>
                            </div>
                        ` : ''}
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex gap-4">
                    ${prop.source_url ? `
                        <a href="${prop.source_url}" target="_blank"
                           class="flex-1 bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 text-center font-semibold">
                            View on Zillow
                        </a>
                    ` : ''}
                    <button onclick="closePropertyModal()"
                            class="flex-1 bg-gray-200 text-gray-700 px-6 py-3 rounded-lg hover:bg-gray-300 font-semibold">
                        Close
                    </button>
                </div>
            `;
        }

        // Initialize
        window.onload = () => {
            loadStats();
            loadProperties(1);
        };
    </script>
</body>
</html>
