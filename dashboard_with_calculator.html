<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PropFusion - Investment Property Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .property-card {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .property-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.15);
        }
        .cap-rate-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .score-badge {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .calculator-input {
            border: 2px solid #e5e7eb;
            transition: border-color 0.2s;
        }
        .calculator-input:focus {
            border-color: #3b82f6;
            outline: none;
        }
        .metric-positive {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
        .metric-negative {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <h1 class="text-3xl font-bold text-gray-900">🏠 PropFusion</h1>
            <p class="text-gray-600 mt-1">Pennsylvania Investment Properties</p>
        </div>
    </header>

    <!-- Stats Bar -->
    <div class="bg-white border-b">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="stats">
                <div class="text-center">
                    <div class="text-2xl font-bold text-blue-600" id="total-properties">-</div>
                    <div class="text-sm text-gray-600">Total Properties</div>
                </div>
                <div class="text-center">
                    <div class="text-2xl font-bold text-green-600" id="avg-price">-</div>
                    <div class="text-sm text-gray-600">Avg Price</div>
                </div>
                <div class="text-center">
                    <div class="text-2xl font-bold text-purple-600" id="avg-cap-rate">-</div>
                    <div class="text-sm text-gray-600">Avg Cap Rate</div>
                </div>
                <div class="text-center">
                    <div class="text-2xl font-bold text-orange-600" id="avg-score">-</div>
                    <div class="text-sm text-gray-600">Avg Score</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Filters -->
    <div class="max-w-7xl mx-auto px-4 py-6">
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-lg font-semibold mb-4">Filters</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">City</label>
                    <select id="filter-city" class="w-full border rounded-lg px-3 py-2">
                        <option value="">All Cities</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Min Cap Rate (%)</label>
                    <input type="number" id="filter-cap-rate" placeholder="e.g., 5"
                           class="w-full border rounded-lg px-3 py-2" step="0.1">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Max Price ($)</label>
                    <input type="number" id="filter-max-price" placeholder="e.g., 200000"
                           class="w-full border rounded-lg px-3 py-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Min Beds</label>
                    <select id="filter-beds" class="w-full border rounded-lg px-3 py-2">
                        <option value="">Any</option>
                        <option value="1">1+</option>
                        <option value="2">2+</option>
                        <option value="3">3+</option>
                        <option value="4">4+</option>
                    </select>
                </div>
            </div>
            <div class="mt-6 pt-4 border-t">
                <h2 class="text-lg font-semibold mb-4">Your Financing</h2>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Down Payment (%)</label>
                        <input type="number" id="assume-down" value="20" min="0" max="100" step="5"
                               class="w-full border rounded-lg px-3 py-2" onchange="refreshCards()">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Interest Rate (%)</label>
                        <input type="number" id="assume-rate" value="7.0" min="0" max="20" step="0.1"
                               class="w-full border rounded-lg px-3 py-2" onchange="refreshCards()">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Loan Term</label>
                        <select id="assume-term" class="w-full border rounded-lg px-3 py-2" onchange="refreshCards()">
                            <option value="30">30 years</option>
                            <option value="15">15 years</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Expenses (% of rent)</label>
                        <input type="number" id="assume-expenses" value="35" min="0" max="100" step="5"
                               class="w-full border rounded-lg px-3 py-2" onchange="refreshCards()">
                    </div>
                </div>
            </div>

            <div class="mt-4 flex gap-2">
                <button onclick="applyFilters()"
                        class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">
                    Apply Filters
                </button>
                <button onclick="resetFilters()"
                        class="bg-gray-200 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-300">
                    Reset
                </button>
            </div>
        </div>

        <div class="mb-4 text-gray-600">
            <span id="results-count">Loading...</span>
        </div>

        <div id="properties-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        </div>

        <div class="mt-8 flex justify-center gap-2" id="pagination">
        </div>
    </div>

    <!-- Property Detail Modal -->
    <div id="property-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 overflow-y-auto">
        <div class="min-h-screen px-4 py-8">
            <div class="max-w-6xl mx-auto bg-white rounded-lg shadow-2xl">
                <div class="flex justify-between items-center p-6 border-b">
                    <h2 class="text-2xl font-bold text-gray-900">Property Details</h2>
                    <button onclick="closePropertyModal()" class="text-gray-500 hover:text-gray-700 text-3xl">
                        &times;
                    </button>
                </div>

                <!-- Tabs -->
                <div class="border-b">
                    <div class="flex px-6">
                        <button onclick="switchTab('info')" id="tab-info"
                                class="py-4 px-6 font-semibold border-b-2 border-blue-600 text-blue-600">
                            Property Info
                        </button>
                        <button onclick="switchTab('calculator')" id="tab-calculator"
                                class="py-4 px-6 font-semibold border-b-2 border-transparent text-gray-600 hover:text-gray-900">
                            💰 Investment Calculator
                        </button>
                    </div>
                </div>

                <div id="property-detail-content" class="p-6">
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8001';
        let currentPage = 1;
        let currentFilters = {};
        let currentProperty = null;
        let currentTab = 'info';

        // Load stats
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/api/properties/stats/summary`);
                const data = await response.json();

                document.getElementById('total-properties').textContent = data.total_properties;
                document.getElementById('avg-price').textContent =
                    '$' + Math.round(data.price_stats.avg_price).toLocaleString();
                document.getElementById('avg-cap-rate').textContent =
                    data.investment_stats.avg_cap_rate.toFixed(2) + '%';
                document.getElementById('avg-score').textContent =
                    data.investment_stats.avg_investment_score.toFixed(1) + '/100';

                const citySelect = document.getElementById('filter-city');
                data.top_cities.forEach(city => {
                    const option = document.createElement('option');
                    option.value = city._id;
                    option.textContent = city._id;
                    citySelect.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Load properties
        async function loadProperties(page = 1) {
            currentPage = page;
            const params = new URLSearchParams({
                page: page,
                page_size: 12,
                sort_by: 'investment_score',
                sort_order: 'desc',
                ...currentFilters
            });

            try {
                const response = await fetch(`${API_BASE}/api/properties/?${params}`);
                const data = await response.json();

                displayProperties(data.properties);
                displayPagination(data);

                document.getElementById('results-count').textContent =
                    `Showing ${data.properties.length} of ${data.total} properties`;
            } catch (error) {
                console.error('Error loading properties:', error);
                document.getElementById('properties-grid').innerHTML =
                    '<div class="col-span-3 text-center text-red-600">Error loading properties. Make sure the backend is running on port 8001.</div>';
            }
        }

        // Get current financing assumptions
        function getAssumptions() {
            return {
                downPct: parseFloat(document.getElementById('assume-down').value) || 20,
                rate: parseFloat(document.getElementById('assume-rate').value) || 7,
                term: parseInt(document.getElementById('assume-term').value) || 30,
                expensesPct: parseFloat(document.getElementById('assume-expenses').value) || 35,
            };
        }

        // Calculate monthly cash flow from user's financing assumptions
        function calcCashFlow(price, rent) {
            if (!price || !rent) return null;
            const { downPct, rate, term, expensesPct } = getAssumptions();
            const loan = price * (1 - downPct / 100);
            const monthlyRate = (rate / 100) / 12;
            const n = term * 12;
            const mortgage = monthlyRate > 0
                ? loan * (monthlyRate * Math.pow(1 + monthlyRate, n)) / (Math.pow(1 + monthlyRate, n) - 1)
                : loan / n;
            const expenses = rent * (expensesPct / 100);
            return rent - expenses - mortgage;
        }

        // Recalculate investment score using same formula as backend
        // Weighted: Cap Rate (40%), Cash Flow (30%), Rent-to-Price ratio (30%)
        function calcInvestmentScore(price, rent) {
            if (!price || !rent) return null;
            const { expensesPct } = getAssumptions();
            const annualRent = rent * 12;
            const annualExpenses = annualRent * (expensesPct / 100);
            const noi = annualRent - annualExpenses;
            const capRate = (noi / price) * 100;
            const cf = calcCashFlow(price, rent);
            const rentRatio = rent / (price / 1000);

            const capRateScore = Math.min(capRate * 10, 40);
            const cashFlowScore = cf > 0 ? Math.min(cf / 10, 30) : 0;
            const rentRatioScore = Math.min(rentRatio * 30, 30);
            return Math.round(capRateScore + cashFlowScore + rentRatioScore);
        }

        // Re-render cash flow + investment score on all cards without re-fetching
        function refreshCards() {
            document.querySelectorAll('[data-property]').forEach(card => {
                const price = parseFloat(card.dataset.price);
                const rent = parseFloat(card.dataset.rent);

                // Update cash flow
                const cfEl = card.querySelector('.cash-flow-value');
                if (cfEl) {
                    const cf = calcCashFlow(price, rent);
                    if (cf === null) {
                        cfEl.parentElement.style.display = 'none';
                    } else {
                        cfEl.parentElement.style.display = 'flex';
                        cfEl.textContent = `$${Math.round(cf).toLocaleString()}/mo`;
                        cfEl.className = `cash-flow-value font-semibold ${cf > 0 ? 'text-green-600' : 'text-red-600'}`;
                    }
                }

                // Update investment score
                const scoreEl = card.querySelector('.investment-score-value');
                if (scoreEl) {
                    const score = calcInvestmentScore(price, rent);
                    if (score !== null) scoreEl.textContent = `${score}/100`;
                }
            });
        }

        // Display properties
        function displayProperties(properties) {
            const grid = document.getElementById('properties-grid');

            if (properties.length === 0) {
                grid.innerHTML = '<div class="col-span-3 text-center text-gray-500">No properties found</div>';
                return;
            }

            grid.innerHTML = properties.map(prop => {
                const cf = calcCashFlow(prop.list_price, prop.rent_estimate);
                return `
                <div class="property-card bg-white rounded-lg shadow hover:shadow-lg overflow-hidden cursor-pointer"
                     onclick="showPropertyDetails('${prop.property_id}')"
                     data-property="${prop.property_id}"
                     data-price="${prop.list_price || 0}"
                     data-rent="${prop.rent_estimate || 0}">
                    <div class="h-48 bg-gray-200 relative">
                        ${prop.image_url ?
                            `<img src="${prop.image_url}" alt="Property" class="w-full h-full object-cover">` :
                            '<div class="w-full h-full flex items-center justify-center text-gray-400">No Image</div>'
                        }
                        ${prop.investment_metrics?.cap_rate ?
                            `<div class="absolute top-2 right-2 cap-rate-badge text-white px-3 py-1 rounded-full text-sm font-bold">
                                ${prop.investment_metrics.cap_rate.toFixed(2)}% Cap Rate
                            </div>` : ''
                        }
                    </div>

                    <div class="p-4">
                        <div class="text-2xl font-bold text-gray-900 mb-2">
                            ${prop.list_price ? '$' + prop.list_price.toLocaleString() : 'Price N/A'}
                        </div>
                        <div class="text-gray-600 mb-3 text-sm">
                            ${prop.full_address || prop.city + ', ' + prop.state}
                        </div>
                        <div class="flex gap-4 text-sm text-gray-600 mb-3">
                            ${prop.beds ? `<span>🛏️ ${prop.beds} beds</span>` : ''}
                            ${prop.baths ? `<span>🛁 ${prop.baths} baths</span>` : ''}
                            ${prop.sqft ? `<span>📏 ${prop.sqft.toLocaleString()} sqft</span>` : ''}
                        </div>
                        ${prop.investment_metrics?.investment_score ? `
                            <div class="border-t pt-3 mt-3">
                                <div class="flex justify-between items-center">
                                    <span class="text-sm text-gray-600">Investment Score</span>
                                    <span class="score-badge text-white px-3 py-1 rounded-full text-sm font-bold investment-score-value">
                                        ${calcInvestmentScore(prop.list_price, prop.rent_estimate) ?? prop.investment_metrics.investment_score.toFixed(1)}/100
                                    </span>
                                </div>
                                <div class="flex justify-between mt-2 text-sm" ${cf === null ? 'style="display:none"' : ''}>
                                    <span class="text-gray-600">Monthly Cash Flow</span>
                                    <span class="cash-flow-value font-semibold ${cf !== null && cf > 0 ? 'text-green-600' : 'text-red-600'}">
                                        ${cf !== null ? '$' + Math.round(cf).toLocaleString() + '/mo' : ''}
                                    </span>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `}).join('');
        }

        // Display pagination
        function displayPagination(data) {
            const pagination = document.getElementById('pagination');
            const buttons = [];

            if (data.page > 1) {
                buttons.push(`
                    <button onclick="loadProperties(${data.page - 1})"
                            class="px-4 py-2 bg-white border rounded-lg hover:bg-gray-50">
                        Previous
                    </button>
                `);
            }

            const startPage = Math.max(1, data.page - 2);
            const endPage = Math.min(data.total_pages, startPage + 4);

            for (let i = startPage; i <= endPage; i++) {
                buttons.push(`
                    <button onclick="loadProperties(${i})"
                            class="px-4 py-2 ${i === data.page ? 'bg-blue-600 text-white' : 'bg-white'} border rounded-lg hover:bg-blue-50">
                        ${i}
                    </button>
                `);
            }

            if (data.page < data.total_pages) {
                buttons.push(`
                    <button onclick="loadProperties(${data.page + 1})"
                            class="px-4 py-2 bg-white border rounded-lg hover:bg-gray-50">
                        Next
                    </button>
                `);
            }

            pagination.innerHTML = buttons.join('');
        }

        // Apply filters
        function applyFilters() {
            currentFilters = {};
            const city = document.getElementById('filter-city').value;
            if (city) currentFilters.city = city;
            const capRate = document.getElementById('filter-cap-rate').value;
            if (capRate) currentFilters.min_cap_rate = parseFloat(capRate);
            const maxPrice = document.getElementById('filter-max-price').value;
            if (maxPrice) currentFilters.max_price = parseInt(maxPrice);
            const minBeds = document.getElementById('filter-beds').value;
            if (minBeds) currentFilters.min_beds = parseInt(minBeds);
            loadProperties(1);
        }

        // Reset filters
        function resetFilters() {
            document.getElementById('filter-city').value = '';
            document.getElementById('filter-cap-rate').value = '';
            document.getElementById('filter-max-price').value = '';
            document.getElementById('filter-beds').value = '';
            currentFilters = {};
            loadProperties(1);
        }

        // Show property details
        async function showPropertyDetails(propertyId) {
            try {
                const response = await fetch(`${API_BASE}/api/properties/${propertyId}`);
                const property = await response.json();
                currentProperty = property;
                currentTab = 'info';

                displayPropertyDetail(property);
                document.getElementById('property-modal').classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            } catch (error) {
                console.error('Error loading property details:', error);
                alert('Error loading property details');
            }
        }

        // Switch tabs
        function switchTab(tab) {
            currentTab = tab;

            // Update tab styling
            document.getElementById('tab-info').className =
                `py-4 px-6 font-semibold border-b-2 ${tab === 'info' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-600 hover:text-gray-900'}`;
            document.getElementById('tab-calculator').className =
                `py-4 px-6 font-semibold border-b-2 ${tab === 'calculator' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-600 hover:text-gray-900'}`;

            // Display appropriate content
            if (tab === 'info') {
                displayPropertyDetail(currentProperty);
            } else {
                displayCalculator(currentProperty);
            }
        }

        // Close modal
        function closePropertyModal() {
            document.getElementById('property-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        // Display property detail (info tab)
        function displayPropertyDetail(prop) {
            const content = document.getElementById('property-detail-content');
            const metrics = prop.investment_metrics || {};

            content.innerHTML = `
                <div class="mb-6">
                    ${prop.image_url ?
                        `<img src="${prop.image_url}" alt="Property" class="w-full h-96 object-cover rounded-lg">` :
                        '<div class="w-full h-64 bg-gray-200 rounded-lg flex items-center justify-center text-gray-400">No Image Available</div>'
                    }
                </div>

                <div class="mb-6">
                    <div class="text-4xl font-bold text-gray-900 mb-2">
                        ${prop.list_price ? '$' + prop.list_price.toLocaleString() : 'Price Not Available'}
                    </div>
                    <div class="text-xl text-gray-600">
                        ${prop.full_address || prop.city + ', ' + prop.state + ' ' + (prop.zip_code || '')}
                    </div>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                    <div class="bg-gray-50 p-4 rounded-lg">
                        <div class="text-gray-600 text-sm mb-1">Bedrooms</div>
                        <div class="text-2xl font-bold">${prop.beds || 'N/A'}</div>
                    </div>
                    <div class="bg-gray-50 p-4 rounded-lg">
                        <div class="text-gray-600 text-sm mb-1">Bathrooms</div>
                        <div class="text-2xl font-bold">${prop.baths || 'N/A'}</div>
                    </div>
                    <div class="bg-gray-50 p-4 rounded-lg">
                        <div class="text-gray-600 text-sm mb-1">Square Feet</div>
                        <div class="text-2xl font-bold">${prop.sqft ? prop.sqft.toLocaleString() : 'N/A'}</div>
                    </div>
                    <div class="bg-gray-50 p-4 rounded-lg">
                        <div class="text-gray-600 text-sm mb-1">Property Type</div>
                        <div class="text-lg font-bold">${prop.property_type || 'N/A'}</div>
                    </div>
                </div>

                ${prop.zestimate || prop.rent_estimate ? `
                    <div class="border rounded-lg p-6 mb-6">
                        <h3 class="text-xl font-bold text-gray-900 mb-4">📊 Zillow Estimates</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${prop.zestimate ? `
                                <div>
                                    <div class="text-gray-600 text-sm mb-1">Zestimate</div>
                                    <div class="text-2xl font-bold text-blue-600">
                                        $${prop.zestimate.toLocaleString()}
                                    </div>
                                </div>
                            ` : ''}
                            ${prop.rent_estimate ? `
                                <div>
                                    <div class="text-gray-600 text-sm mb-1">Estimated Rent</div>
                                    <div class="text-2xl font-bold text-green-600">
                                        $${prop.rent_estimate.toLocaleString()}/month
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                ` : ''}

                <div class="border rounded-lg p-6 mb-6">
                    <h3 class="text-xl font-bold text-gray-900 mb-4">ℹ️ Additional Details</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                        ${prop.lot_size ? `
                            <div class="flex justify-between">
                                <span class="text-gray-600">Lot Size:</span>
                                <span class="font-semibold">${prop.lot_size.toLocaleString()} ${prop.lot_size_units || 'sqft'}</span>
                            </div>
                        ` : ''}
                        ${prop.days_on_zillow !== null && prop.days_on_zillow !== undefined ? `
                            <div class="flex justify-between">
                                <span class="text-gray-600">Days on Zillow:</span>
                                <span class="font-semibold">${prop.days_on_zillow} days</span>
                            </div>
                        ` : ''}
                        <div class="flex justify-between">
                            <span class="text-gray-600">Status:</span>
                            <span class="font-semibold text-green-600">${prop.status || 'FOR_SALE'}</span>
                        </div>
                        ${prop.source_url ? `
                            <div class="flex justify-between col-span-2">
                                <span class="text-gray-600">Zillow Link:</span>
                                <a href="${prop.source_url}" target="_blank"
                                   class="text-blue-600 hover:underline font-semibold">
                                    View on Zillow →
                                </a>
                            </div>
                        ` : ''}
                    </div>
                </div>

                <div class="flex gap-4">
                    ${prop.source_url ? `
                        <a href="${prop.source_url}" target="_blank"
                           class="flex-1 bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 text-center font-semibold">
                            View on Zillow
                        </a>
                    ` : ''}
                    <button onclick="switchTab('calculator')"
                            class="flex-1 bg-purple-600 text-white px-6 py-3 rounded-lg hover:bg-purple-700 font-semibold">
                            💰 Open Calculator
                    </button>
                </div>
            `;
        }

        // Display calculator (calculator tab)
        function displayCalculator(prop) {
            const content = document.getElementById('property-detail-content');

            // Default values
            const purchasePrice = prop.list_price || 0;
            const estimatedRent = prop.rent_estimate || 0;

            content.innerHTML = `
                <div class="bg-gradient-to-br from-blue-50 to-purple-50 rounded-lg p-6 mb-6">
                    <h3 class="text-2xl font-bold text-gray-900 mb-2">💰 Investment Calculator</h3>
                    <p class="text-gray-600 mb-4">Adjust the values below to see how different scenarios affect your returns</p>

                    <div class="bg-white rounded-lg p-6 shadow-sm">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <!-- Purchase Price -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Purchase Price ($)</label>
                                <input type="number" id="calc-price" value="${purchasePrice}"
                                       class="w-full calculator-input rounded-lg px-4 py-2"
                                       onchange="calculate()">
                            </div>

                            <!-- Down Payment % -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Down Payment (%)</label>
                                <input type="number" id="calc-down-payment" value="20" min="0" max="100" step="5"
                                       class="w-full calculator-input rounded-lg px-4 py-2"
                                       onchange="calculate()">
                            </div>

                            <!-- Interest Rate -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Interest Rate (%)</label>
                                <input type="number" id="calc-interest" value="7.0" min="0" max="20" step="0.1"
                                       class="w-full calculator-input rounded-lg px-4 py-2"
                                       onchange="calculate()">
                            </div>

                            <!-- Loan Term -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Loan Term (years)</label>
                                <select id="calc-term" class="w-full calculator-input rounded-lg px-4 py-2"
                                        onchange="calculate()">
                                    <option value="30">30 years</option>
                                    <option value="15">15 years</option>
                                </select>
                            </div>

                            <!-- Monthly Rent -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Monthly Rent ($)</label>
                                <input type="number" id="calc-rent" value="${estimatedRent}"
                                       class="w-full calculator-input rounded-lg px-4 py-2"
                                       onchange="calculate()">
                            </div>

                            <!-- Operating Expenses % -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Operating Expenses (% of rent)</label>
                                <input type="number" id="calc-expenses" value="35" min="0" max="100" step="5"
                                       class="w-full calculator-input rounded-lg px-4 py-2"
                                       onchange="calculate()">
                                <p class="text-xs text-gray-500 mt-1">Taxes, insurance, maintenance, vacancies</p>
                            </div>
                        </div>

                        <button onclick="calculate()"
                                class="mt-6 w-full bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 font-semibold">
                            ⚡ Calculate Returns
                        </button>
                    </div>
                </div>

                <!-- Results -->
                <div id="calc-results" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Results will appear here -->
                </div>
            `;

            // Auto-calculate on load
            setTimeout(() => calculate(), 100);
        }

        // Calculate investment metrics
        function calculate() {
            // Get input values
            const price = parseFloat(document.getElementById('calc-price').value) || 0;
            const downPaymentPct = parseFloat(document.getElementById('calc-down-payment').value) || 0;
            const interestRate = parseFloat(document.getElementById('calc-interest').value) || 0;
            const loanTerm = parseInt(document.getElementById('calc-term').value) || 30;
            const monthlyRent = parseFloat(document.getElementById('calc-rent').value) || 0;
            const expensesPct = parseFloat(document.getElementById('calc-expenses').value) || 0;

            // Calculate loan details
            const downPayment = price * (downPaymentPct / 100);
            const loanAmount = price - downPayment;
            const monthlyInterestRate = (interestRate / 100) / 12;
            const numberOfPayments = loanTerm * 12;

            // Monthly mortgage payment formula: M = P[r(1+r)^n]/[(1+r)^n-1]
            let monthlyMortgage = 0;
            if (monthlyInterestRate > 0) {
                const x = Math.pow(1 + monthlyInterestRate, numberOfPayments);
                monthlyMortgage = loanAmount * (monthlyInterestRate * x) / (x - 1);
            } else {
                monthlyMortgage = loanAmount / numberOfPayments;
            }

            // Operating expenses
            const monthlyExpenses = monthlyRent * (expensesPct / 100);

            // Monthly cash flow
            const monthlyCashFlow = monthlyRent - monthlyExpenses - monthlyMortgage;

            // Annual calculations
            const annualRent = monthlyRent * 12;
            const annualExpenses = monthlyExpenses * 12;
            const noi = annualRent - annualExpenses;

            // Cap Rate (NOI / Purchase Price)
            const capRate = price > 0 ? (noi / price) * 100 : 0;

            // Cash-on-Cash Return (Annual Cash Flow / Down Payment)
            const annualCashFlow = monthlyCashFlow * 12;
            const cashOnCashReturn = downPayment > 0 ? (annualCashFlow / downPayment) * 100 : 0;

            // ROI (Annual Cash Flow / Total Investment)
            const roi = downPayment > 0 ? (annualCashFlow / downPayment) * 100 : 0;

            // Display results
            const resultsDiv = document.getElementById('calc-results');
            resultsDiv.innerHTML = `
                <!-- Monthly Cash Flow -->
                <div class="bg-white rounded-lg p-6 shadow-lg border-2 ${monthlyCashFlow > 0 ? 'border-green-500' : 'border-red-500'}">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm font-medium text-gray-600">Monthly Cash Flow</span>
                        <span class="text-xs ${monthlyCashFlow > 0 ? 'text-green-600' : 'text-red-600'}">
                            ${monthlyCashFlow > 0 ? 'Positive' : 'Negative'}
                        </span>
                    </div>
                    <div class="text-4xl font-bold ${monthlyCashFlow > 0 ? 'text-green-600' : 'text-red-600'}">
                        $${Math.round(monthlyCashFlow).toLocaleString()}/mo
                    </div>
                    <div class="text-sm text-gray-500 mt-2">
                        Rent ($${monthlyRent.toLocaleString()}) - Expenses ($${Math.round(monthlyExpenses).toLocaleString()}) - Mortgage ($${Math.round(monthlyMortgage).toLocaleString()})
                    </div>
                </div>

                <!-- Cap Rate -->
                <div class="bg-white rounded-lg p-6 shadow-lg">
                    <div class="text-sm font-medium text-gray-600 mb-2">Cap Rate</div>
                    <div class="text-4xl font-bold text-purple-600">
                        ${capRate.toFixed(2)}%
                    </div>
                    <div class="text-sm text-gray-500 mt-2">
                        NOI ($${Math.round(noi).toLocaleString()}) / Price ($${price.toLocaleString()})
                    </div>
                </div>

                <!-- Cash-on-Cash Return -->
                <div class="bg-white rounded-lg p-6 shadow-lg">
                    <div class="text-sm font-medium text-gray-600 mb-2">Cash-on-Cash Return</div>
                    <div class="text-4xl font-bold text-blue-600">
                        ${cashOnCashReturn.toFixed(2)}%
                    </div>
                    <div class="text-sm text-gray-500 mt-2">
                        Annual return on your down payment of $${Math.round(downPayment).toLocaleString()}
                    </div>
                </div>

                <!-- Monthly Mortgage -->
                <div class="bg-white rounded-lg p-6 shadow-lg">
                    <div class="text-sm font-medium text-gray-600 mb-2">Monthly Mortgage Payment</div>
                    <div class="text-4xl font-bold text-orange-600">
                        $${Math.round(monthlyMortgage).toLocaleString()}
                    </div>
                    <div class="text-sm text-gray-500 mt-2">
                        ${loanTerm} year loan at ${interestRate}%
                    </div>
                </div>

                <!-- Down Payment -->
                <div class="bg-white rounded-lg p-6 shadow-lg">
                    <div class="text-sm font-medium text-gray-600 mb-2">Down Payment Required</div>
                    <div class="text-4xl font-bold text-indigo-600">
                        $${Math.round(downPayment).toLocaleString()}
                    </div>
                    <div class="text-sm text-gray-500 mt-2">
                        ${downPaymentPct}% of purchase price
                    </div>
                </div>

                <!-- Annual NOI -->
                <div class="bg-white rounded-lg p-6 shadow-lg">
                    <div class="text-sm font-medium text-gray-600 mb-2">Annual NOI</div>
                    <div class="text-4xl font-bold text-teal-600">
                        $${Math.round(noi).toLocaleString()}
                    </div>
                    <div class="text-sm text-gray-500 mt-2">
                        Net Operating Income (before mortgage)
                    </div>
                </div>
            `;
        }

        // Initialize
        window.onload = () => {
            loadStats();
            loadProperties(1);
        };
    </script>
</body>
</html>
